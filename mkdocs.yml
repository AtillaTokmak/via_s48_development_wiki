site_name: Casper VIA S48 Android Development Knowledge Base
site_description: Complete technical documentation, reverse engineering, kernel overclocking, and Android 16 bring-up for Casper VIA S48 (MT8168 / F716).
site_author: Atilla Tokmak
repo_url: https://github.com/AtillaTokmak/via_s48_development_wiki
repo_name: AtillaTokmak/via_s48_development_wiki

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Hardware:
      - Overview: docs/hardware/overview.md
      - MediaTek MT8168 SoC: docs/hardware/mt8168.md
      - Partition Layout: docs/hardware/partition-layout.md
      - Kernel Architecture: docs/hardware/kernel.md
      - Display & Touchscreen: docs/hardware/display-touch.md
  - Firmware:
